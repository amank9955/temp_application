<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <h1>Todo App</h1>
    <p class="subtitle">Keep track of your daily tasks.</p>

    <form id="todoForm" class="todo-form">
      <input id="todoInput" type="text" placeholder="Enter a task..." maxlength="120" required />
      <button type="submit">Add Task</button>
    </form>

    <div class="toolbar">
      <span id="taskCount">0 tasks</span>
      <button id="clearCompleted" type="button" class="secondary">Clear completed</button>
    </div>

    <ul id="todoList" class="todo-list"></ul>
    <p id="emptyState" class="empty">No tasks yet. Add your first task!</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
